<div class="profile-container" *ngIf="user">
  <button (click)="goBack()" class="btn-back">← Volver</button>
  
  <div class="profile-header">
    <img [src]="getFullPhotoUrl(user.fotoPerfil)" alt="Profile" class="profile-avatar">
    <div class="profile-info">
      <div class="profile-actions">
  <button *ngIf="user.id !== currentUserId && !areFriends" 
          class="btn-friend-request" 
          (click)="enviarSolicitudAmistad(user.id)"
          [disabled]="solicitudEnviada">
    
    <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
      <path d="M16 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path>
      <circle cx="8.5" cy="7" r="4"></circle>
      <line x1="20" y1="8" x2="20" y2="14"></line>
      <line x1="23" y1="11" x2="17" y2="11"></line>
    </svg>
    {{ solicitudEnviada ? 'Solicitud Enviada' : 'Añadir a Amigos' }}
  </button>

  <button *ngIf="areFriends" class="btn-message" (click)="enviarMensaje(user.id)">
    Enviar Mensaje
  </button>
</div>

  <div class="profile-section">
    <h3>Sobre mí</h3>
    <p>{{user.descripcion || 'Sin descripción disponible.'}}</p>
  </div>

  <div class="profile-grid">
    <div class="profile-card">
      <h3>Tecnologías</h3>
      <div class="tags">
        <span *ngFor="let tech of user.tecnologias" class="tag tech">{{tech}}</span>
        <span *ngIf="!user.tecnologias?.length" class="empty-msg">No especificadas</span>
      </div>
    </div>

    <div class="profile-card">
      <h3>Lenguajes</h3>
      <div class="tags">
        <span *ngFor="let lang of user.lenguajes" class="tag lang">{{lang}}</span>
        <span *ngIf="!user.lenguajes?.length" class="empty-msg">No especificados</span>
      </div>
    </div>
  </div>

  <div class="profile-section" *ngIf="user.informacionExtra">
    <h3>Información Adicional</h3>
    <p>{{user.informacionExtra}}</p>
  </div>
</div>

<div *ngIf="loading" class="loading">Cargando perfil...</div>
