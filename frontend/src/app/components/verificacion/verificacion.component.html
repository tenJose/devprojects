<div class="verificacion-container">
  <div class="verificacion-card">
    <div class="icon-header">
      🛡️
    </div>
    
    <h1>Verifica tu cuenta</h1>
    <p class="subtitulo">
      Hemos enviado un código de acceso a <strong>{{ email }}</strong>.
      Ingrésalo abajo para continuar.
    </p>

    <div *ngIf="error" class="alert alert-error">
      {{ error }}
    </div>
    <div *ngIf="mensaje" class="alert alert-success">
      {{ mensaje }}
    </div>

    <form (ngSubmit)="verificar()" class="verificacion-form">
      <div class="form-group">
        <input 
          type="text" 
          name="codigo"
          [(ngModel)]="codigo" 
          placeholder="Ej. 123456"
          maxlength="6"
          class="input-codigo"
          autocomplete="off"
          autofocus
        />
      </div>

      <button type="submit" class="btn-verificar" [disabled]="cargando || !codigo">
        {{ cargando ? 'Verificando...' : 'Confirmar Código' }}
      </button>
    </form>

    <div class="footer-actions">
      <p>¿No recibiste el código?</p>
      <button (click)="reenviar()" class="btn-reenviar" [disabled]="bloqueoReenvio">
        {{ bloqueoReenvio ? 'Espera unos segundos...' : 'Reenviar código' }}
      </button>
    </div>
  </div>
</div>
